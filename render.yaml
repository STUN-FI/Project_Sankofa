services:
  - type: web
    name: lighthub-backend
    env: python
    plan: starter
    region: oregon
    root: Backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
